services:
  nirikshan:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: "replace-with-a-random-32-plus-character-secret"
      CORS_ORIGIN: "http://localhost:4000"
      NIRIKSHAN_USERS_JSON: >-
        [{"id":"officer-demo","username":"officer","password":"change-this","role":"officer"},
         {"id":"incharge-demo","username":"incharge","password":"change-this","role":"incharge"},
         {"id":"civilian-demo","username":"civilian","password":"change-this","role":"civilian"},
         {"id":"contractor-demo","username":"contractor","password":"change-this","role":"contractor"}]
      NIRIKSHAN_DATA_DIR: /app/runtime
    volumes:
      - nirikshan-data:/app/runtime
volumes:
  nirikshan-data:
